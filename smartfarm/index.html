<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SmartFarm IoT Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
  --bg-base:#0b0f0e;
  --bg-panel:#111815;
  --bg-card:#161d1a;
  --bg-hover:#1d2622;

  --border:#243028;
  --border-glow:#2a5c3f;

  --accent:#3ddc84;
  --accent-dim:#1f7a4a;
  --accent-glow:rgba(61,220,132,.18);

  --warn:#f0a500;
  --danger:#e05252;

  --text-1:#e8f0ec;
  --text-2:#7a9e8a;
  --text-3:#415950;

  --font-ui:'Syne',sans-serif;
  --font-mono:'Space Mono',monospace;

  --radius:8px;
  --transition:.2s ease;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg-base);
  color:var(--text-1);
  font-family:var(--font-ui);
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  inset:0;

  background:
  repeating-linear-gradient(
    to bottom,
    transparent,
    transparent 2px,
    rgba(0,0,0,.04) 2px,
    rgba(0,0,0,.04) 4px
  );

  pointer-events:none;
  z-index:999;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:18px 32px;

  border-bottom:1px solid var(--border);

  background:var(--bg-panel);

  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  width:36px;
  height:36px;

  border-radius:6px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--accent);

  font-size:18px;
}

.logo-text{
  font-size:1.1rem;
  font-weight:800;
}

.logo-sub{
  font-size:.65rem;
  color:var(--text-3);
  font-family:var(--font-mono);
}

.header-right{
  display:flex;
  align-items:center;
  gap:16px;
}

.status-pill{
  display:flex;
  align-items:center;
  gap:6px;

  padding:5px 12px;

  border-radius:20px;

  border:1px solid var(--border);

  font-family:var(--font-mono);
  font-size:.7rem;
  color:var(--text-2);
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--text-3);
}

.status-dot.live{
  background:var(--accent);
  box-shadow:0 0 8px var(--accent);
}

.status-dot.error{
  background:var(--danger);
}

.btn{
  padding:7px 16px;

  border-radius:var(--radius);

  border:1px solid var(--border-glow);

  background:transparent;

  color:var(--accent);

  cursor:pointer;

  font-family:var(--font-mono);
}

.btn:hover{
  background:var(--accent-glow);
}

.btn-solid{
  background:var(--accent);
  color:#000;
}

main{
  padding:28px 32px;
  max-width:1500px;
  margin:auto;
}

.section-label{
  font-family:var(--font-mono);
  font-size:.7rem;

  margin-bottom:12px;

  color:var(--text-3);

  text-transform:uppercase;
}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;

  margin-bottom:28px;
}

.kpi-card{
  background:var(--bg-card);

  border:1px solid var(--border);

  border-radius:var(--radius);

  padding:20px;
}

.kpi-card:hover{
  border-color:var(--border-glow);
}

.kpi-icon{
  font-size:1.4rem;
  margin-bottom:10px;
}

.kpi-label{
  font-size:.7rem;
  color:var(--text-3);

  font-family:var(--font-mono);

  margin-bottom:6px;
}

.kpi-value{
  font-size:2rem;
  font-weight:800;
}

.kpi-unit{
  font-size:.8rem;
  color:var(--text-2);
}

.relay-card.on{
  border-color:var(--accent);
  background:rgba(61,220,132,.05);
}

.relay-label-status{
  margin-top:10px;
  font-weight:700;
}

.relay-card.on .relay-label-status{
  color:var(--accent);
}

.relay-card.off .relay-label-status{
  color:var(--text-3);
}

.charts-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;

  margin-bottom:28px;
}

@media(max-width:900px){
  .charts-row{
    grid-template-columns:1fr;
  }
}

.chart-card{
  background:var(--bg-card);

  border:1px solid var(--border);

  border-radius:var(--radius);

  padding:20px;
}

.chart-title{
  margin-bottom:14px;

  font-size:.7rem;
  color:var(--text-2);

  font-family:var(--font-mono);
}

.chart-wrap{
  position:relative;
  height:240px;
}

.table-card{
  background:var(--bg-card);

  border:1px solid var(--border);

  border-radius:var(--radius);

  overflow:hidden;
}

.table-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:14px 20px;

  border-bottom:1px solid var(--border);
}

.search-box{
  padding:7px 12px;

  border-radius:var(--radius);

  background:var(--bg-panel);

  border:1px solid var(--border);

  color:var(--text-1);
}

.table-scroll{
  overflow-x:auto;
  max-height:500px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-family:var(--font-mono);
  font-size:.72rem;
}

thead th{
  background:var(--bg-panel);

  padding:12px 14px;

  text-align:left;

  color:var(--text-3);

  border-bottom:1px solid var(--border);
}

tbody td{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  color:var(--text-2);
}

.badge{
  display:inline-block;

  padding:2px 8px;

  border-radius:4px;

  font-size:.65rem;
}

.badge-on{
  background:rgba(61,220,132,.15);
  color:var(--accent);
}

.badge-off{
  background:rgba(255,255,255,.04);
  color:var(--text-3);
}

footer{
  padding:30px;
  text-align:center;
  color:var(--text-3);
}

</style>
</head>

<body>

<header>

<div class="logo">
  <div class="logo-icon">🌱</div>

  <div>
    <div class="logo-text">SmartFarm</div>
    <div class="logo-sub">IoT MONITOR v2.0</div>
  </div>
</div>

<div class="header-right">

  <div class="status-pill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">connecting...</span>
  </div>

  <button class="btn" onclick="fetchAll()">↻ Refresh</button>

  <button class="btn btn-solid" onclick="exportCSV()">⬇ CSV</button>

</div>

</header>

<main>

<div class="section-label">Live Readings</div>

<div class="kpi-grid" id="kpiGrid"></div>


<div class="section-label">Charts</div>

<div class="charts-row">

  <div class="chart-card">
    <div class="chart-title">🌡 Temperature & Humidity</div>
    <div class="chart-wrap">
      <canvas id="chartTempHum"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-title">☀️ LDR</div>
    <div class="chart-wrap">
      <canvas id="chartLdr"></canvas>
    </div>
  </div>

</div>


<div class="charts-row">

  <div class="chart-card">
    <div class="chart-title">🌱 Soil Moisture</div>
    <div class="chart-wrap">
      <canvas id="chartSoil"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-title">📏 Water Distance</div>
    <div class="chart-wrap">
      <canvas id="chartDistance"></canvas>
    </div>
  </div>

</div>


<div class="section-label">History</div>

<div class="table-card">

  <div class="table-toolbar">
    <span>Sensor Records</span>

    <input
      class="search-box"
      id="searchBox"
      type="text"
      placeholder="Filter..."
      oninput="filterTable()"
    />
  </div>

  <div class="table-scroll">

    <table id="dataTable">

      <thead>
      <tr>
        <th>#</th>
        <th>Timestamp</th>
        <th>Temp</th>
        <th>Humidity</th>
        <th>LDR</th>
        <th>Soil</th>
        <th>Distance</th>
        <th>Pump1</th>
        <th>Feeder</th>
        <th>Pump2</th>
        <th>Light</th>
      </tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

</div>

</main>

<footer>
SmartFarm IoT Dashboard — ESP32 + Flask + MySQL + ML
</footer>

<script>

const API_BASE = 'https://smartfarm-ai-ttjj.onrender.com';

let allRows = [];

let chartTH = null;
let chartL = null;
let chartSoil = null;
let chartDistance = null;

window.addEventListener('DOMContentLoaded', () => {

  fetchAll();

  setInterval(fetchAll, 60000);

});

async function fetchAll(){

  await Promise.all([
    fetchLatest(),
    fetchHistory(),
    fetchChartData()
  ]);

}

async function fetchLatest(){

  try{

    const res = await fetch(`${API_BASE}/latest`);

    const d = await res.json();

    renderKPI(d);

    setStatus('live','Connected');

  }catch(e){

    setStatus('error','Offline');

  }

}

function renderKPI(d){

  const grid = document.getElementById('kpiGrid');

  grid.innerHTML = `

    ${kpiCard('🌡️','Temperature',d.temperature?.toFixed(1),'°C',tempColour(d.temperature))}

    ${kpiCard('💧','Humidity',d.humidity?.toFixed(1),'%','#6ac9f5')}

    ${kpiCard('☀️','LDR',d.ldr_value,'',ldrColour(d.ldr_value))}

    ${kpiCard('🌱','Soil Moisture',d.soil_moisture,'',soilColour(d.soil_moisture))}

    ${kpiCard('📏','Distance',d.distance?.toFixed(1),'cm',distanceColour(d.distance))}

    ${relayCard('🚰','Pump 1',d.relay1_pump1)}

    ${relayCard('⚙️','Feeder',d.relay2_feeder)}

    ${relayCard('💦','Pump 2',d.relay3_pump2)}

    ${relayCard('💡','Grow Light',d.relay4_light)}

  `;

}

function kpiCard(icon,label,value,unit,colour){

  return `
  <div class="kpi-card">

    <div class="kpi-icon">${icon}</div>

    <div class="kpi-label">${label}</div>

    <div class="kpi-value" style="color:${colour}">
      ${value ?? '--'}
      <span class="kpi-unit">${unit}</span>
    </div>

  </div>
  `;

}

function relayCard(icon,label,status){

  const on = status == 1;

  return `
  <div class="kpi-card relay-card ${on ? 'on':'off'}">

    <div class="kpi-icon">${icon}</div>

    <div class="kpi-label">${label}</div>

    <div class="relay-label-status">
      ${on ? '● ACTIVE':'○ OFF'}
    </div>

  </div>
  `;

}

function tempColour(t){

  return t > 30
  ? 'var(--danger)'
  : 'var(--accent)';

}

function ldrColour(v){

  return v < 1500
  ? 'var(--accent)'
  : 'var(--warn)';

}

function soilColour(v){

  if(v > 2500)
    return 'var(--danger)';

  if(v > 1500)
    return 'var(--warn)';

  return 'var(--accent)';

}

function distanceColour(v){

  if(v < 10)
    return 'var(--danger)';

  if(v < 20)
    return 'var(--warn)';

  return 'var(--accent)';

}

async function fetchHistory(){

  const res = await fetch(`${API_BASE}/sensor-data?limit=100`);

  allRows = await res.json();

  renderTable(allRows);

}

function renderTable(rows){

  const tbody = document.getElementById('tableBody');

  tbody.innerHTML = rows.map(r => `

    <tr>

      <td>${r.id}</td>

      <td>${formatTime(r.timestamp)}</td>

      <td>${r.temperature?.toFixed(1)}</td>

      <td>${r.humidity?.toFixed(1)}</td>

      <td>${r.ldr_value}</td>

      <td>${r.soil_moisture}</td>

      <td>${r.distance?.toFixed(1)} cm</td>

      <td>${badge(r.relay1_pump1)}</td>

      <td>${badge(r.relay2_feeder)}</td>

      <td>${badge(r.relay3_pump2)}</td>

      <td>${badge(r.relay4_light)}</td>

    </tr>

  `).join('');

}

function badge(v){

  return v
  ? '<span class="badge badge-on">ON</span>'
  : '<span class="badge badge-off">OFF</span>';

}

async function fetchChartData(){

  const res = await fetch(`${API_BASE}/chart-data?points=50`);

  const data = await res.json();

  const labels = data.map(r => formatTimeShort(r.timestamp));

  buildCharts(labels,data);

}

function buildCharts(labels,data){

  const opts = {

    responsive:true,

    maintainAspectRatio:false,

    plugins:{
      legend:{
        labels:{
          color:'#7a9e8a'
        }
      }
    },

    scales:{
      x:{
        ticks:{color:'#415950'},
        grid:{color:'#1d2622'}
      },

      y:{
        ticks:{color:'#415950'},
        grid:{color:'#1d2622'}
      }
    }

  };

  if(chartTH) chartTH.destroy();

  chartTH = new Chart(document.getElementById('chartTempHum'),{

    type:'line',

    data:{
      labels,

      datasets:[

        {
          label:'Temperature',
          data:data.map(r => r.temperature),
          borderColor:'#3ddc84',
          tension:.3
        },

        {
          label:'Humidity',
          data:data.map(r => r.humidity),
          borderColor:'#6ac9f5',
          tension:.3
        }

      ]
    },

    options:opts

  });


  if(chartL) chartL.destroy();

  chartL = new Chart(document.getElementById('chartLdr'),{

    type:'line',

    data:{
      labels,

      datasets:[{
        label:'LDR',
        data:data.map(r => r.ldr_value),
        borderColor:'#f0a500',
        tension:.3
      }]
    },

    options:opts

  });


  if(chartSoil) chartSoil.destroy();

  chartSoil = new Chart(document.getElementById('chartSoil'),{

    type:'line',

    data:{
      labels,

      datasets:[{
        label:'Soil Moisture',
        data:data.map(r => r.soil_moisture),
        borderColor:'#00d26a',
        tension:.3
      }]
    },

    options:opts

  });


  if(chartDistance) chartDistance.destroy();

  chartDistance = new Chart(document.getElementById('chartDistance'),{

    type:'line',

    data:{
      labels,

      datasets:[{
        label:'Distance',
        data:data.map(r => r.distance),
        borderColor:'#ff6b6b',
        tension:.3
      }]
    },

    options:opts

  });

}

function exportCSV(){

  window.open(`${API_BASE}/export/csv`,'_blank');

}

function formatTime(ts){

  return new Date(ts).toLocaleString();

}

function formatTimeShort(ts){

  const d = new Date(ts);

  return `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;

}

function setStatus(state,text){

  document.getElementById('statusDot').className =
  `status-dot ${state}`;

  document.getElementById('statusText').textContent = text;

}

function filterTable(){

  const q = document
    .getElementById('searchBox')
    .value
    .toLowerCase();

  renderTable(

    allRows.filter(r =>
      JSON.stringify(r)
      .toLowerCase()
      .includes(q)
    )

  );

}

</script>

</body>
</html>
