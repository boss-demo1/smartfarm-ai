<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartFarm — IoT Dashboard</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════
   DESIGN SYSTEM — Industrial / Precision Instrument
═══════════════════════════════════════════════════ */
:root {
  --bg-base:     #0b0f0e;
  --bg-panel:    #111815;
  --bg-card:     #161d1a;
  --bg-hover:    #1d2622;
  --border:      #243028;
  --border-glow: #2a5c3f;
  --accent:      #3ddc84;
  --accent-dim:  #1f7a4a;
  --accent-glow: rgba(61,220,132,.18);
  --warn:        #f0a500;
  --danger:      #e05252;
  --text-1:      #e8f0ec;
  --text-2:      #7a9e8a;
  --text-3:      #415950;
  --font-ui:     'Syne', sans-serif;
  --font-mono:   'Space Mono', monospace;
  --radius:      8px;
  --transition:  .2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-base);
  color: var(--text-1);
  font-family: var(--font-ui);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline atmosphere */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,.04) 2px, rgba(0,0,0,.04) 4px);
  pointer-events: none; z-index: 999;
}

header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 32px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(8px);
}

.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 36px; height: 36px;
  background: var(--accent); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.logo-text { font-size: 1.1rem; font-weight: 800; letter-spacing: .04em; }
.logo-sub  { font-size: .65rem; color: var(--text-3); font-family: var(--font-mono); letter-spacing:.08em; }

.header-right { display: flex; align-items: center; gap: 16px; }

.status-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: .7rem;
  color: var(--text-2);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); transition: background var(--transition); }
.status-dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
.status-dot.error{ background: var(--danger); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.btn {
  padding: 7px 16px; border-radius: var(--radius);
  border: 1px solid var(--border-glow);
  background: transparent; color: var(--accent);
  font-family: var(--font-mono); font-size: .72rem;
  cursor: pointer; transition: all var(--transition);
}
.btn:hover { background: var(--accent-glow); border-color: var(--accent); }
.btn-solid  { background: var(--accent); color: #0b0f0e; border-color: var(--accent); }

main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

.section-label {
  font-family: var(--font-mono); font-size: .65rem;
  color: var(--text-3); letter-spacing: .15em;
  text-transform: uppercase; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px; margin-bottom: 28px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: border-color var(--transition), transform var(--transition);
}
.kpi-card:hover { border-color: var(--border-glow); transform: translateY(-2px); }

.kpi-icon { font-size: 1.4rem; margin-bottom: 10px; }
.kpi-label { font-family: var(--font-mono); font-size: .62rem; color: var(--text-3); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
.kpi-value { font-size: 2rem; font-weight: 800; color: var(--text-1); line-height: 1; }
.kpi-unit  { font-size: .8rem; color: var(--text-2); margin-left: 3px; }

.relay-card { border-color: var(--border); }
.relay-card.on  { border-color: var(--accent); background: rgba(61,220,132,.06); }
.relay-label-status { font-size: .75rem; font-weight: 600; margin-top: 8px; }
.relay-card.on  .relay-label-status { color: var(--accent); }
.relay-card.off .relay-label-status { color: var(--text-3); }

.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
@media(max-width:900px){ .charts-row { grid-template-columns: 1fr; } }

.chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.chart-title { font-family: var(--font-mono); font-size: .7rem; color: var(--text-2); margin-bottom: 14px; text-transform: uppercase; }
.chart-wrap { position: relative; height: 200px; }

.table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 28px; }
.table-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.search-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px; color: var(--text-1); font-family: var(--font-mono); font-size: .72rem; }

.table-scroll { overflow-x: auto; max-height: 420px; }
table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: .72rem; }
thead th { background: var(--bg-panel); padding: 10px 14px; text-align: left; color: var(--text-3); position: sticky; top: 0; border-bottom: 1px solid var(--border); }
tbody td { padding: 9px 14px; color: var(--text-2); border-bottom: 1px solid var(--border); }

.badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: .65rem; }
.badge-on  { background: rgba(61,220,132,.15); color: var(--accent); border: 1px solid var(--accent-dim); }
.badge-off { background: rgba(255,255,255,.04); color: var(--text-3); border: 1px solid var(--border); }

#toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg-panel); border: 1px solid var(--border-glow); color: var(--accent); padding: 10px 18px; border-radius: var(--radius); opacity: 0; transition: .3s; pointer-events: none; }
#toast.show { opacity: 1; }

.skeleton { background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🌱</div>
    <div>
      <div class="logo-text">SmartFarm</div>
      <div class="logo-sub">IoT MONITOR v1.0</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-pill">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">connecting…</span>
    </div>
    <button class="btn" onclick="fetchAll()">↻ Refresh</button>
    <button class="btn btn-solid" onclick="exportCSV()">⬇ CSV</button>
  </div>
</header>

<main>
  <div class="section-label">Live Readings</div>
  <div class="kpi-grid" id="kpiGrid">
    <div class="kpi-card"><div class="kpi-icon">🌡️</div><div class="kpi-label">Temperature</div><div class="kpi-value skeleton" style="height:2rem;width:80px"></div></div>
    <div class="kpi-card"><div class="kpi-icon">💧</div><div class="kpi-label">Humidity</div><div class="kpi-value skeleton" style="height:2rem;width:80px"></div></div>
    <div class="kpi-card"><div class="kpi-icon">☀️</div><div class="kpi-label">Light (LDR)</div><div class="kpi-value skeleton" style="height:2rem;width:80px"></div></div>
    <div class="kpi-card relay-card"><div class="kpi-icon">💡</div><div class="kpi-label">Grow Light</div><div class="kpi-value skeleton" style="height:2rem;width:80px"></div></div>
  </div>

  <div class="section-label">Time Series</div>
  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">🌡 Temperature & Humidity</div>
      <div class="chart-wrap"><canvas id="chartTempHum"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">☀ Light Level (LDR)</div>
      <div class="chart-wrap"><canvas id="chartLdr"></canvas></div>
    </div>
  </div>

  <div class="section-label">History</div>
  <div class="table-card">
    <div class="table-toolbar">
      <span class="table-title">Sensor Records</span>
      <input class="search-box" id="searchBox" type="text" placeholder="Filter rows…" oninput="filterTable()" />
    </div>
    <div class="table-scroll">
      <table id="dataTable">
        <thead>
          <tr>
            <th>#</th><th>Timestamp</th><th>Temp °C</th><th>Humidity %</th><th>LDR</th><th>Light Status</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-3)">Loading data…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<footer>SmartFarm IoT Dashboard — Reduced Sensor Set</footer>

<div id="toast"></div>

<script>
const API_BASE = 'https://smartfarm-ai-ttjj.onrender.com';
let allRows = [];
let chartTH = null;
let chartL  = null;

window.addEventListener('DOMContentLoaded', () => {
  fetchAll();
  setInterval(fetchAll, 60_000);
});

async function fetchAll() {
  await Promise.all([fetchLatest(), fetchHistory(), fetchChartData()]);
}

async function fetchLatest() {
  try {
    const res = await fetch(`${API_BASE}/latest`);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    renderKPI(d);
    setStatus('live', `Last update: ${formatTimeShort(d.timestamp)}`);
  } catch (e) {
    setStatus('error', 'Server offline');
  }
}

function renderKPI(d) {
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = `
    ${kpiCard('🌡️','Temperature', d.temperature?.toFixed(1), '°C', tempColour(d.temperature))}
    ${kpiCard('💧','Humidity', d.humidity?.toFixed(1), '%', '#6ac9f5')}
    ${kpiCard('☀️','Light (LDR)', d.ldr_value, '', ldrColour(d.ldr_value))}
    ${relayCard('💡','Grow Light', d.light_status)}
  `;
}

function kpiCard(icon, label, value, unit, colour) {
  return `<div class="kpi-card">
    <div class="kpi-icon">${icon}</div>
    <div class="kpi-label">${label}</div>
    <div class="kpi-value" style="color:${colour}">${value ?? '—'}<span class="kpi-unit">${unit}</span></div>
  </div>`;
}

function relayCard(icon, label, status) {
  const on = status === 1;
  return `<div class="kpi-card relay-card ${on?'on':'off'}">
    <div class="kpi-icon">${icon}</div>
    <div class="kpi-label">${label}</div>
    <div class="relay-label-status">${on ? '● ACTIVE' : '○ STANDBY'}</div>
  </div>`;
}

function tempColour(t) { return t > 30 ? 'var(--danger)' : 'var(--accent)'; }
function ldrColour(v) { return v < 300 ? 'var(--text-3)' : 'var(--warn)'; }

async function fetchHistory() {
  try {
    const res = await fetch(`${API_BASE}/sensor-data?limit=100`);
    allRows = await res.json();
    renderTable(allRows);
  } catch(e) { console.error(e); }
}

function renderTable(rows) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.id}</td>
      <td>${formatTime(r.timestamp)}</td>
      <td>${r.temperature?.toFixed(1) ?? '—'}</td>
      <td>${r.humidity?.toFixed(1) ?? '—'}</td>
      <td>${r.ldr_value ?? '—'}</td>
      <td>${badge(r.light_status)}</td>
    </tr>`).join('');
}

function badge(v) {
  return v ? `<span class="badge badge-on">ON</span>` : `<span class="badge badge-off">OFF</span>`;
}

async function fetchChartData() {
  try {
    const res = await fetch(`${API_BASE}/chart-data?points=50`);
    const data = await res.json();
    const labels = data.map(r => formatTimeShort(r.timestamp));
    buildCharts(labels, data);
  } catch(e) { console.error(e); }
}

function buildCharts(labels, data) {
  const opts = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#7a9e8a', font: { family:"'Space Mono'" } } } },
    scales: { x: { ticks: { color:'#415950' }, grid:{color:'#1d2622'} }, y: { ticks: { color:'#415950' }, grid:{color:'#1d2622'} } }
  };

  if (chartTH) chartTH.destroy();
  chartTH = new Chart(document.getElementById('chartTempHum'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label:'Temp °C', data: data.map(r=>r.temperature), borderColor:'#3ddc84', tension:.3 },
        { label:'Humidity %', data: data.map(r=>r.humidity), borderColor:'#6ac9f5', tension:.3 }
      ]
    },
    options: opts
  });

  if (chartL) chartL.destroy();
  chartL = new Chart(document.getElementById('chartLdr'), {
    type: 'line',
    data: {
      labels,
      datasets: [{ label:'LDR Value', data: data.map(r=>r.ldr_value), borderColor:'#f0a500', tension:.3 }]
    },
    options: opts
  });
}

function exportCSV() { window.open(`${API_BASE}/export/csv`, '_blank'); }

function formatTime(ts) { return new Date(ts).toLocaleString(); }
function formatTimeShort(ts) {
  const d = new Date(ts);
  return `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
}

function setStatus(state, text) {
  document.getElementById('statusDot').className = `status-dot ${state}`;
  document.getElementById('statusText').textContent = text;
}

function filterTable() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  renderTable(allRows.filter(r => JSON.stringify(r).toLowerCase().includes(q)));
}
</script>
</body>
</html>
